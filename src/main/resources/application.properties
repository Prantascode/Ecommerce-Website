spring.application.name=ecommerce
server.port=9090
spring.profiles.active=local

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.name=${APP_ADMIN_NAME}

spring.jpa.hibernate.ddl-auto=update      
spring.jpa.show-sql=true       
spring.jpa.properties.hibernate.format_sql=true            

 # SSLCommerz Sandbox Credentials
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD}
sslcommerz.base-url=${SSLCOMMERZ_BASE_URL}
sslcommerz.init-url=${SSLCOMMERZ_INIT_URL}
sslcommerz.validation-url=${SSLCOMMERZ_VALIDATION_URL}
sslcommerz.callback-url=http://localhost:9090/api/payments

# Set to false for production
sslcommerz.sandbox=true

app.frontend-url=http://localhost:5173

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ThisIsAReallyLongSuperSecretKeyForHS256JWT1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refreshExpirationSec=604800